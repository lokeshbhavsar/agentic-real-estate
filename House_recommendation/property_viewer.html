<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommended Properties</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0e17;
      --surface: #121826;
      --card: #1a2234;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --mint: #34d399;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Outfit", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(245, 158, 11, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(52, 211, 153, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown 0.8s ease;
    }

    header h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 1.05rem;
    }

    .counter {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 500;
    }

    /* Carousel shell */
    .carousel-wrap {
      position: relative;
      perspective: 1200px;
    }

    .carousel-track {
      position: relative;
      min-height: 620px;
    }

    .property-card {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateX(60px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .property-card.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
      position: relative;
    }

    .property-card.exit-left {
      opacity: 0;
      transform: translateX(-60px) scale(0.96);
    }

    .card-inner {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 0;
      background: var(--card);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 900px) {
      .card-inner { grid-template-columns: 1fr; }
      .carousel-track { min-height: auto; }
    }

    /* Image gallery */
    .gallery {
      position: relative;
      background: #0d1117;
      min-height: 420px;
      overflow: hidden;
    }

    .gallery-main {
      width: 100%;
      height: 420px;
      object-fit: cover;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: zoom-in;
    }

    .gallery:hover .gallery-main {
      transform: scale(1.08);
    }

    .gallery-placeholder {
      width: 100%;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1a1a2e 100%);
      font-size: 4rem;
      opacity: 0.4;
    }

    .gallery-nav {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 2;
    }

    .gallery-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }

    .gallery-dot.active {
      width: 24px;
      border-radius: 4px;
      background: var(--accent);
    }

    .img-prev, .img-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.55);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s, background 0.3s;
      z-index: 2;
    }

    .gallery:hover .img-prev,
    .gallery:hover .img-next { opacity: 1; }

    .img-prev:hover, .img-next:hover { background: var(--accent); }
    .img-prev { left: 1rem; }
    .img-next { right: 1rem; }

    .similarity-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--mint);
      font-weight: 600;
      font-size: 0.85rem;
      backdrop-filter: blur(8px);
      animation: pulseGlow 2.5s ease infinite;
    }

    /* Details panel */
    .details {
      padding: 2rem 2rem 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .highlight-price {
      font-family: "Playfair Display", serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
      animation: shimmer 3s ease infinite;
      background: linear-gradient(90deg, var(--accent), #fcd34d, var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .heading {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.35;
      color: #fff;
    }

    .location {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .location span { color: var(--accent); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }

    .stat {
      background: var(--surface);
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      border: 1px solid var(--border);
      transition: transform 0.25s, border-color 0.25s;
    }

    .stat:hover {
      transform: translateY(-3px);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 0.15rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .tag {
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(245, 158, 11, 0.12);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.25);
      transition: transform 0.2s, background 0.2s;
    }

    .tag:hover {
      transform: scale(1.05);
      background: rgba(245, 158, 11, 0.22);
    }

    .description {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.65;
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .meta-row strong { color: var(--text); }

    /* Main carousel controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .ctrl-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      transform: scale(1.08);
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .dots-main {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 320px;
    }

    .dot-main {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: all 0.3s;
    }

    .dot-main.active {
      background: var(--accent);
      transform: scale(1.2);
    }

    .thumbnails {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding: 1.5rem 0 0.5rem;
      scroll-snap-type: x mandatory;
    }

    .thumb {
      flex: 0 0 140px;
      scroll-snap-align: start;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.35s;
      opacity: 0.55;
    }

    .thumb.active {
      border-color: var(--accent);
      opacity: 1;
      transform: scale(1.04);
    }

    .thumb:hover { opacity: 1; transform: scale(1.06); }

    .thumb img {
      width: 140px;
      height: 90px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s;
    }

    .thumb:hover img { transform: scale(1.12); }

    .thumb-placeholder {
      width: 140px;
      height: 90px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .loading, .error {
      text-align: center;
      padding: 4rem;
      color: var(--muted);
    }

    .error { color: #f87171; }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 200% center; }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.3); }
      50% { box-shadow: 0 0 20px 4px rgba(52, 211, 153, 0.15); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Recommended Properties</h1>
      <p>Curated matches based on your preferences</p>
      <div class="counter" id="counter">Loading...</div>
    </header>

    <div id="content">
      <div class="loading">Loading properties...</div>
    </div>
  </div>

  <script>
    let properties = [];
    let currentIndex = 0;
    let imageIndices = {};

    async function init() {
      try {
        const res = await fetch("/api/properties");
        properties = await res.json();
        if (!properties.length) {
          document.getElementById("content").innerHTML = '<div class="error">No properties found in CSV.</div>';
          return;
        }
        properties.forEach((_, i) => { imageIndices[i] = 0; });
        render();
      } catch (e) {
        document.getElementById("content").innerHTML = `<div class="error">Failed to load: ${e.message}</div>`;
      }
    }

    function esc(str) {
      const d = document.createElement("div");
      d.textContent = str ?? "";
      return d.innerHTML;
    }

    function renderGallery(prop, idx) {
      const imgs = prop.images || [];
      const imgIdx = imageIndices[idx] || 0;

      if (!imgs.length) {
        return `<div class="gallery"><div class="gallery-placeholder">🏠</div></div>`;
      }

      const dots = imgs.map((_, i) =>
        `<button class="gallery-dot ${i === imgIdx ? "active" : ""}" onclick="setImage(${idx}, ${i})"></button>`
      ).join("");

      return `
        <div class="gallery">
          <div class="similarity-badge">${(prop.similarity * 100).toFixed(1)}% match</div>
          <button class="img-prev" onclick="shiftImage(${idx}, -1)">‹</button>
          <img class="gallery-main" src="${esc(imgs[imgIdx])}" alt="${esc(prop.heading)}" onerror="this.parentElement.innerHTML='<div class=\\'gallery-placeholder\\'>🏠</div>'" />
          <button class="img-next" onclick="shiftImage(${idx}, 1)">›</button>
          ${imgs.length > 1 ? `<div class="gallery-nav">${dots}</div>` : ""}
        </div>`;
    }

    function renderCard(prop, idx) {
      const tags = (prop.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
      const floor = prop.floor != null ? `${prop.floor}${prop.total_floors ? " / " + prop.total_floors : ""}` : "—";

      return `
        <article class="property-card ${idx === currentIndex ? "active" : ""}" data-idx="${idx}">
          <div class="card-inner">
            ${renderGallery(prop, idx)}
            <div class="details">
              <div class="highlight-price">${esc(prop.price)}</div>
              <h2 class="heading">${esc(prop.heading)}</h2>
              <div class="location">📍 <span>${esc(prop.locality)}</span>, ${esc(prop.city)}</div>

              <div class="stats">
                <div class="stat"><div class="stat-val">${esc(prop.bhk)}</div><div class="stat-label">Config</div></div>
                <div class="stat"><div class="stat-val">${esc(String(prop.area))}</div><div class="stat-label">Area</div></div>
                <div class="stat"><div class="stat-val">${esc(String(floor))}</div><div class="stat-label">Floor</div></div>
              </div>

              <div class="stats">
                <div class="stat"><div class="stat-val">${prop.bathrooms ?? "—"}</div><div class="stat-label">Bath</div></div>
                <div class="stat"><div class="stat-val">${prop.balconies ?? "—"}</div><div class="stat-label">Balcony</div></div>
                <div class="stat"><div class="stat-val">${prop.landmarks ?? "—"}</div><div class="stat-label">Landmarks</div></div>
              </div>

              ${tags ? `<div class="tags">${tags}</div>` : ""}
              <p class="description">${esc(prop.description)}</p>
              <div class="meta-row">
                <span><strong>${esc(prop.society)}</strong></span>
                <span>${esc(prop.type)}</span>
              </div>
              <div class="meta-row">
                <span>Agent: <strong>${esc(prop.contact)}</strong></span>
                <span>${esc(prop.dealer)}</span>
              </div>
            </div>
          </div>
        </article>`;
    }

    function renderThumbs() {
      return properties.map((p, i) => {
        const img = (p.images && p.images[0]) || null;
        const inner = img
          ? `<img src="${esc(img)}" alt="" onerror="this.parentElement.innerHTML='<div class=\\'thumb-placeholder\\'>🏠</div>'" />`
          : `<div class="thumb-placeholder">🏠</div>`;
        return `<div class="thumb ${i === currentIndex ? "active" : ""}" onclick="goTo(${i})">${inner}</div>`;
      }).join("");
    }

    function render() {
      const cards = properties.map((p, i) => renderCard(p, i)).join("");
      const dots = properties.map((_, i) =>
        `<button class="dot-main ${i === currentIndex ? "active" : ""}" onclick="goTo(${i})"></button>`
      ).join("");

      document.getElementById("counter").textContent =
        `Property ${currentIndex + 1} of ${properties.length}`;

      document.getElementById("content").innerHTML = `
        <div class="carousel-wrap">
          <div class="carousel-track" id="track">${cards}</div>
          <div class="controls">
            <button class="ctrl-btn" onclick="shift(-1)" aria-label="Previous">‹</button>
            <div class="dots-main">${dots}</div>
            <button class="ctrl-btn" onclick="shift(1)" aria-label="Next">›</button>
          </div>
          <div class="thumbnails">${renderThumbs()}</div>
        </div>`;
    }

    function goTo(idx) {
      if (idx === currentIndex || idx < 0 || idx >= properties.length) return;
      const cards = document.querySelectorAll(".property-card");
      cards[currentIndex]?.classList.remove("active");
      cards[currentIndex]?.classList.add("exit-left");
      currentIndex = idx;
      setTimeout(render, 50);
    }

    function shift(dir) {
      goTo((currentIndex + dir + properties.length) % properties.length);
    }

    function setImage(propIdx, imgIdx) {
      imageIndices[propIdx] = imgIdx;
      const card = document.querySelector(`.property-card[data-idx="${propIdx}"]`);
      if (card) {
        const gallery = card.querySelector(".gallery");
        if (gallery) gallery.outerHTML = renderGallery(properties[propIdx], propIdx);
      }
    }

    function shiftImage(propIdx, dir) {
      const imgs = properties[propIdx].images || [];
      if (!imgs.length) return;
      const next = (imageIndices[propIdx] + dir + imgs.length) % imgs.length;
      setImage(propIdx, next);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") shift(-1);
      if (e.key === "ArrowRight") shift(1);
    });

    init();
  </script>
</body>
</html>
